<!-- 右側隱藏面板外層 -->
<div class="side-cart-panel" [class.show]="isCartVisible">
  <!-- Header 區 -->
  <header class="cart-header">
    <h5>YOUR CART ({{ cartItems.length }})</h5>
    <button class="close-button" (click)="closeCart()">×</button>
  </header>

  <!-- 商品列表區 (可捲動) -->
  <div class="cart-items-container">
    <ul class="cart-items">
      <li class="cart-item" *ngFor="let item of cartItems; index as i">
        <!-- 商品圖片 -->
        <div class="product-thumbnail">
          <!-- 綁定實際圖片路徑: [src]="item.imageUrl" -->
          <img [src]="'assets/images/shop/' + item.imageUrl" alt="Product" />
        </div>

        <!-- 商品資訊 -->
        <div class="product-info">
          <!-- 商品名稱 -->
          <div class="product-name">
            {{ item.productName || "商品名稱" }}
          </div>
          <!-- 商品細項 (如顏色、尺寸等) -->
          <div class="product-detail">
            <div
              class="color-field"
              *ngIf="item.color && item.color !== '無選擇'"
            >
              顏色:
              <span
                class="color-swatch"
                [style.backgroundColor]="item.color"
              ></span>
            </div>
            <div *ngIf="item.size && item.size !== '無選擇'">
              尺寸: {{ item.size }}
            </div>
            <!-- Thickness -->
            <div *ngIf="item.thickness !== '無選擇'">
              厚度: {{ item.thickness }}
            </div>

            <!-- Gender -->
            <div *ngIf="item.gender !== '無選擇'">
              性別款式: {{ item.gender }}
            </div>
          </div>

          <!-- 若有缺貨狀態，可顯示提示 -->
          <div class="out-of-stock" *ngIf="item.stock <= 0">缺貨中</div>

          <!-- 金額 & 數量 -->
          <div class="product-row">
            <div class="product-price">
              ${{ item.unitpriceatCart | number : "1.0-0" }}
            </div>
            <div class="product-quantity">
              <span>{{ item.quantity }}</span>
            </div>
          </div>
        </div>
        <!-- 移除商品 -->
        <button
          class="remove-item" (click)="removeFromCart(item)"
          (click)="removeItem(item.productvariantsId!, item.memberId!)"
          aria-label="Remove item"
        >
          <i class="fa fa-trash" aria-hidden="true"></i>
        </button>
      </li>
    </ul>
  </div>

  <!-- 底部結算區 -->
  <div class="cart-footer">
    <!-- 錯誤提示(若有) -->
    <!-- <div class="cart-error" *ngIf="hasError">
      THERE IS A PROBLEM WITH ONE OR MORE ITEMS IN YOUR CART
    </div> -->

    <!-- 金額資訊 -->
    <div class="cart-totals">
      <div class="totals-row">
        <span>商品小計:</span>
        <span>${{ subTotal }}</span>
      </div>
      <!-- <div class="totals-row">
        <span>Import Duties:</span>
        <span>Paid</span>
      </div> -->
      <div class="totals-row">
        <span>運費:</span>
        <span>免運</span>
      </div>
      <div class="totals-row total-amount">
        <span>訂購總額:</span>
        <strong>${{ total }}</strong>
      </div>
    </div>

    <!-- 優惠碼 / gift card -->
    <!-- <div class="promo-code">
      <div class="promo-toggle" (click)="togglePromoInput()">
        Add promo code / gift card <span [class.active]="showPromo">+</span>
      </div> -->
    <!-- <div class="promo-input" *ngIf="showPromo">
        <input type="text" [(ngModel)]="couponCode" placeholder="Enter code" />
        <button (click)="applyCoupon()">Apply</button>
      </div>
    </div> -->

    <!-- 結帳按鈕 (若商品缺貨可禁用) -->
    <!-- <button
      class="checkout-btn"
      [disabled]="hasError"
      (click)="proceedToCheckout()"
    > -->
    <button (click)="proceedToCheckout()">
      前往結帳
      <i class="fa-regular fa-credit-card" style="font-size: 24px"></i>
    </button>
  </div>
</div>
