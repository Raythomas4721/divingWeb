<div>
  <div class="container">
    <!-- 一行(row)，左邊 main，右邊 aside -->
    <div class="row">
      <!-- 左邊 主內容：col-lg-7 col-xl-8 -->
      <main class="col-lg-7 col-xl-8">
        <!-- 價格排序區塊 -->
        <div class="products-selection">
          <p class="woocommerce-result-count">Showing all 23 results</p>
          <form class="woocommerce-ordering" method="get">
            <select
              name="orderby"
              class="orderby"
              [(ngModel)]="selectedOrder"
              (change)="onOrderChange($event)"
            >
              <!-- 預設排序 -->
              <option value="menu_order" selected="selected">預設排序</option>
              <!-- 依價格由低到高 -->
              <option value="price">價格：由低到高</option>
              <!-- 依價格由高到低 -->
              <option value="price-desc">價格：由高到低</option>
            </select>
          </form>
        </div>

        <!-- 商品列表 -->
        <ul class="products columns-2">
          <li class="product" *ngFor="let product of products">
            <div class="product-inner">
              <div
                class="image-swap-container"
                *ngIf="hasSecondVersion(product.imageUrl); else singleImg"
              >
                <a
                  (click)="onClickProduct(product.productId)"
                  href="javascript:void(0)"
                >
                  <img
                    class="primary-img"
                    [src]="'assets/images/shop/' + product.imageUrl"
                    alt="{{ product.imageUrl }}"
                  />
                  <img
                    class="hover-img"
                    [src]="
                      'assets/images/shop/' +
                      product.imageUrl.replace('.jpg', '-1.jpg')
                    "
                    alt="第二張圖片"
                  />
                </a>
              </div>
              <ng-template #singleImg>
                <div class="image-swap-container">
                  <a
                    (click)="onClickProduct(product.productId)"
                    href="javascript:void(0)"
                  >
                    <img [src]="'assets/images/shop/' + product.imageUrl" />
                  </a>
                </div>
              </ng-template>
              <div class="product-wrap">
                <h2 class="woocommerce-loop-product__title">
                  <a [routerLink]="['/shopproductshow', product.productId]">
                    {{ product.productName }}
                  </a>
                </h2>
                <div class="star-rating">
                  <span style="width: 80%"
                    >Rated <strong class="rating">4.00</strong> out of 5
                  </span>
                </div>
                <div class="price-wrap">
                  <span class="price">
                    <span><span>$</span>{{ product.unitPrice }}</span>
                  </span>
                  <!-- 當按下按鈕時呼叫 onAddToCart(product) -->
                  <a
                    class="button product_type_simple add_to_cart_button"
                    [routerLink]="['/shopproductshow', product.productId]"
                  >
                    Add to cart
                  </a>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </main>

      <!-- 右邊 側邊欄：col-lg-5 col-xl-4 -->
      <aside class="col-lg-5 col-xl-4">
        <div class="ls ms">
          <div class="widget widget_product_search">
            <h3 class="widget-title">Search</h3>
            <!-- 使用 Angular 的表單 (ngSubmit) 送出後呼叫 onSearch() -->
            <form class="woocommerce-product-search" (ngSubmit)="onSearch()">
              <label class="screen-reader-text" for="searchField">
                Search for:
              </label>
              <!-- [(ngModel)] 綁定 searchTerm -->
              <input
                type="search"
                id="searchField"
                class="search-field"
                placeholder="Search products..."
                [(ngModel)]="searchTerm"
                name="searchTerm"
              />
              <input type="submit" value="Search" />
            </form>
          </div>
        </div>

        <div class="widget woocommerce widget_product_categories">
          <h3 class="widget-title">Categories</h3>
          <ul class="product-categories">
            <li
              class="cat-item"
              *ngFor="let cat of sideCats"
              (click)="goToShop(cat.productCategoryId)"
            >
              <a href="javascript:void(0)">{{ cat.categoryName }}</a>
            </li>
          </ul>
        </div>

        <!-- top商品列 -->
        <div class="widget woocommerce widget_top_rated_products">
          <h3 class="widget-title">Top Products</h3>
          <ul class="product_list_widget">
            <li *ngFor="let product of topProducts">
              <a [routerLink]="['/shopproductshow', product.productId]">
                <img
                  [src]="'assets/images/shop/' + product.imageUrl"
                  alt="{{ product.productName }}"
                />
              </a>
              <div>
                <span class="product-title">
                  <a [routerLink]="['/shopproductshow', product.productId]">
                    {{ product.productName }}
                  </a>
                </span>
                <p>Price: {{ product.unitPrice }}</p>
                <p>Views: {{ product.viewCount }}</p>
              </div>
            </li>
          </ul>
        </div>
      </aside>
    </div>
    <!-- .row 結束 -->
