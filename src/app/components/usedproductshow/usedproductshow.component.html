<!-- Unyson messages modal -->
<div class="modal fade" tabindex="-1" role="dialog" id="messages_modal">
  <div class="fw-messages-wrap ls p-normal">


  </div>
</div><!-- eof .modal -->



<!-- wrappers for visual page editor and boxed version of template -->
<div id="canvas">
  <div id="box_wrapper">

    <!-- template sections -->

    <div class="header_absolute ds cover-background ">
      <!-- header with three Bootstrap columns - left for logo, center for navigation and right for includes-->

    </div>

    <section class="page_title ds s-parallax s-overlay s-pt-160 s-pb-80">
      <div class="container">
        <div class="row">

          <div class="col-md-12">
            <h1>出售商品</h1>
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="./">首頁</a>
              </li>
              <li class="breadcrumb-item">
                <a href="#">二手商品</a>
              </li>
              <li class="breadcrumb-item active">
                出售商品
              </li>
            </ol>
          </div>

        </div>
      </div>
    </section>
    <!-- start your coding here-->
    <!-- Title -->
    <section class="ls s-py-90 s-py-xl-160 c-gutter-60">
      <div class="container">
        <div class="row">

          <main class="col-lg-12">
            <div class="woocommerce-notices-wrapper">
              <div class="container-fluid mt-5 py-1">
                <div class="container">
                  <div *ngIf="isLoading" class="text-center">
                    <p>載入中...</p>
                  </div>
                  <form>
                    <div class="row mt-3 mb-3 justify-content-center">
                      <!-- 圖片上傳 -->
                      <div class="col-md-6 d-flex flex-column align-items-center bg-light shadow p-3">
                        <div class="upload-area mb-2 p-3 w-100 h-200 text-center">
                          <i class="fa-regular fa-image fa-2xl mt-5"></i>
                          <p class="text-muted mt-2">拖曳圖片到這裡或點擊選擇圖片</p>
                          <!-- 顯示錯誤訊息 -->
                          <button type="button" class="btn btn-darkgrey m-3"><i
                              class="fa-solid fa-check"></i>&nbsp;&nbsp;選擇圖片</button>
                          <p class="text-info mt-2">最多上傳 6 張圖片</p>
                          <input type="file" class="form-control-file d-none" />
                        </div>

                        <!-- 預覽圖片區域 -->
                        <div class="container">
                          <div class="row d-flex row-cols-3 flex-wrap justify-content-start">
                            <div class="col-auto position-relative p-2">
                              <div class="position-absolute top-0 start-0" style="top: 4px; left: 8px;">
                                <!-- 封面標籤 -->

                              </div>
                              <div class="position-absolute top-0 end-0" style="top: 10px; right: 10px;">
                                <!-- 刪除按鈕 -->
                                <!-- <button type="button" class="btn btn-primary rounded-pill btn-sm ">

                                </button> -->
                              </div>
                              <!-- 預覽圖片 -->
                              <img src="/src/assets/images/404.jpg" class=""
                                style="width: 160px; height:160px; object-fit: contain;">
                            </div>
                          </div>
                        </div>

                      </div>
                      <div class="col-5 bg-light shadow mx-4 p-4">
                        <!-- 商品名稱 -->
                        <div class=" form-group">
                          <label for="productName"><i class="fa-solid fa-cube icon"></i>&nbsp;&nbsp;商品名稱</label>
                          <input type="text" id="productName" class="form-control" formControlName="fProductName"
                            required />
                          <!-- <small *ngIf="productForm.get('fProductName')?.invalid && productForm.get('fProductName')?.touched"
                            class="text-danger">
                            商品名稱至少需要 3 個字元
                          </small> -->
                        </div>
                        <!-- 商品類別 -->
                        <div class="form-group">
                          <label for="productCategoryId"><i class="fa-solid fa-cube icon"></i>&nbsp;&nbsp;商品類別</label>
                          <select class="form-control" id="productCategory" formControlName="categoryId" required>
                            <option *ngFor="let item of usedCategory" [value]="item.categoryId">{{item.categoryName}}
                            </option>
                          </select>
                        </div>
                        <!-- 商品價格 -->
                        <div class="form-group">
                          <label for="productPrice"><i class="fa-solid fa-cube icon"></i>&nbsp;&nbsp;價格</label>
                          <input type="text" id="productPrice" class="form-control" formControlName="fProductPrice"
                            required />
                          <small class="text-danger">
                            請填寫正確價格
                          </small>
                        </div>

                        <!-- 商品描述 -->
                        <div class="form-group">
                          <label for="productDescription">商品描述</label>
                          <textarea id="productDescription" class="form-control" rows="3"
                            formControlName="fProductDescription" placeholder="請描述產品狀況並包含買家可能感興趣的任何細節。"></textarea>
                        </div>
                        <!-- 商品狀況 -->
                        <div class="form-group">
                          <label>商品狀況</label>

                          <select class="form-control" id="productCategory" formControlName="fProductCategoryId"
                            required>
                            <option *ngFor="let item of usedCondition" [value]="item.productConditionId">
                              {{item.condition}}
                            </option>
                          </select>

                        </div>

                        <!-- 商品狀態 -->
                        <!-- <div class="form-group">
                          <label><i class="fa-solid fa-cube icon"></i>&nbsp;&nbsp;是否上架</label>
                          <div>
                            <input type="radio" id="onSale" formControlName="fIsOnSales" [value]="true" />
                            <label for="onSale">&nbsp;販售中&nbsp;&nbsp;</label>

                            <input type="radio" id="offSale" formControlName="fIsOnSales" [value]="false" />
                            <label for="offSale">&nbsp;未販售</label>
                          </div>
                        </div> -->

                        <!-- 商品庫存 -->
                        <div class="form-group">
                          <label for="productStock"><i class="fa-solid fa-cube icon"></i>&nbsp;&nbsp;庫存數量</label>
                          <input type="text" id="productStock" class="form-control" formControlName="fStock" required />
                          <small class="text-danger">
                            數量至少1個
                          </small>
                        </div>
                        <!-- 送出按鈕 -->
                        <button type="submit" class="btn btn-darkgrey m-3"><i
                            class="fa-solid fa-arrow-up"></i>&nbsp;&nbsp;上架</button>
                        <button class="btn btn-darkgrey m-3" routerLink="/used-products"><i
                            class="fa-solid fa-xmark"></i>&nbsp;取消</button>
                      </div>

                    </div>
                  </form>
                </div>
              </div>
            </div>
          </main>
        </div>

      </div>
    </section>
  </div><!-- eof #box_wrapper -->
</div><!-- eof #canvas -->
