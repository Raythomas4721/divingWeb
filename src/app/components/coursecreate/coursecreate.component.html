<div class="container">
    <div class="header">
      <h2>編輯課程</h2>
    </div>
    <form >
      <div class="form-group">
        <label for="courseName">課程名稱</label>
        <input id="courseName" formControlName="courseName" type="text" class="form-control" placeholder="請輸入課程名稱" />
      </div>
      
      <div class="form-group">
        <label for="category">課程分類</label>
        <select id="category" formControlName="category" class="form-control">
          <option >category.name </option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="level">課程等級</label>
        <select id="level" formControlName="level" class="form-control">
          <option  >level.name </option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="coach">教練</label>
        <select id="coach" formControlName="coach" class="form-control">
          <option > coach.name </option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="price">課程價格</label>
        <input id="price" formControlName="price" type="number" class="form-control" placeholder="請輸入課程價格" />
      </div>
  
      <div class="form-group">
        <label for="photo">課程照片</label>
        <input id="photo" formControlName="photo" type="file" class="form-control" />
      </div>
  
      <div class="form-group">
        <label for="description">課程描述</label>
        <textarea id="description" formControlName="description" class="form-control" placeholder="請輸入課程描述"></textarea>
      </div>
  
      <div class="form-group">
        <label for="status">課程狀態</label>
        <input id="status" formControlName="status" type="checkbox" />
      </div>
  
      <div class="form-group">
        <label for="startAt">開始時間</label>
        <input id="startAt" formControlName="startAt" type="datetime-local" class="form-control" />
      </div>
  
      <button type="submit" class="btn btn-primary">儲存變更</button>
    </form>
  </div>
