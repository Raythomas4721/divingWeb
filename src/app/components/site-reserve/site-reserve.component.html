<!-- search modal -->
<div class="modal" tabindex="-1" role="dialog" aria-labelledby="search_modal" id="search_modal">
  <button type="button" class="close" data-dismiss="modal" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
  <div class="widget widget_search">
    <form method="get" class="searchform search-form" action="/">
      <div class="form-group">
        <input type="text" value="" name="search" class="form-control" placeholder="Search keyword"
          id="modal-search-input">
      </div>
      <button type="submit" class="btn">Search</button>
    </form>
  </div>
</div>

<!-- Unyson messages modal -->
<div class="modal fade" tabindex="-1" role="dialog" id="messages_modal">
  <div class="fw-messages-wrap ls p-normal">
    <!-- Uncomment this UL with LI to show messages in modal popup to your user: -->
    <!--
		<ul class="list-unstyled">
			<li>Message To User</li>
		</ul>
		-->

  </div>
</div><!-- eof .modal -->

<div class="modal fade popupLogin" id="popupLogin" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content ds ms overflow-visible s-overlay s-mobile-overlay">
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
      <div class="modal-body">
        <div class="container">
          <div class="row">
            <div class="col-12">
              <h4 class="color-main mb-3">Log in</h4>
              <form class="form-registration c-mb-20 c-gutter-20" action="/">
                <div class="row mb-4">
                  <div class="col-sm-12">
                    <div class="form-group">
                      <input type="text" name="name" class="form-control" required placeholder="login"
                        aria-required="true">
                    </div>
                  </div>
                  <div class="col-sm-12">
                    <div class="form-group">
                      <input type="password" name="password" class="form-control" placeholder="password"
                        aria-required="true" required>
                    </div>
                  </div>
                </div>
                <a class="registerRedirect " data-dismiss="modal" data-target="#popupRegistr" data-toggle="modal"
                  href="#">Not a member? Register!</a>
                <button type="submit" class="btn btn-maincolor mt-30 d-block">Sign In</button>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade popupRegistr" id="popupRegistr" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content ds ms overflow-visible s-overlay s-mobile-overlay">
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
      <div class="modal-body">
        <div class="container">
          <div class="row">
            <div class="col-12">
              <h4 class="color-main mb-4">Registration</h4>
              <form class="form-registration c-mb-20 c-gutter-20" method="post" action="/">
                <div class="row">
                  <div class="col-12">
                    <div class="form-group">
                      <input type="text" name="name" class="form-control" required placeholder="login"
                        aria-required="true">
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-group">
                      <input type="password" name="password" class="form-control" placeholder="password"
                        aria-required="true" required>
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-group">
                      <input type="email" name="email" class="form-control" placeholder="email" required
                        aria-required="true">
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-group">
                      <input type="password" name="confirmPassword" class="form-control" placeholder="password" required
                        aria-required="true">
                    </div>
                  </div>
                  <div class="col-12">
                    <div class="form-group">
                      <input type="checkbox" id="agreed" name="agreed" value="agreed" required
                        aria-required="true"><label for="agreed">I agree to the rules</label>
                    </div>
                  </div>
                </div>
                <button type="submit" class="btn btn-maincolor mt-30 d-block">Registration</button>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

                            id="shipping_country_field" data-priority="40" style="margin-bottom: 1em;">
                            <label for="time_period" class="">請選擇時段<abbr class="required"
                                title="required">*</abbr></label>
                            <select name="time_period" id="time_period"
                              class="country_to_state country_select  select2-hidden-accessible" autocomplete="country"
                              tabindex="-1" aria-hidden="true" [(ngModel)]="selectedTimePeriod">
                              <option value="">請選擇時段</option>
                              <option value="上午">上午</option>
                              <option value="下午">下午</option>
                              <option value="晚上">晚上</option>
                            </select>
                          </p>
                          <h2>付款方式</h2>
                          <div class="payment-methods">
                            <label>
                              <input type="radio" name="paymentMethod" value="creditCard" checked>
                              信用卡
                              <img
                                src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/MasterCard_Logo.svg/2560px-MasterCard_Logo.svg.png"
                                alt="MasterCard">
                              <img
                                src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png"
                                alt="Visa">
                            </label>
                          </div>
                          <div class="form-group">
                            <label for="cardHolder">持卡人姓名</label>
                            <input type="text" id="cardHolder" class="input-text" placeholder="請輸入持卡人姓名" maxlength="30"
                              [(ngModel)]="cardHolder" name="cardHolder">
                            <div class="error-message">請輸入本人姓名</div>
                          </div>
                          <div class="form-group">
                            <label for="cardNumber">信用卡卡號</label>
                            <input type="text" id="cardNumber1" class="input-small" maxlength="4"
                              [(ngModel)]="cardNumber1" name="cardNumber1"> -
                            <input type="text" id="cardNumber2" class="input-small" maxlength="4"
                              [(ngModel)]="cardNumber2" name="cardNumber2"> -
                            <input type="text" id="cardNumber3" class="input-small" maxlength="4"
                              [(ngModel)]="cardNumber3" name="cardNumber3"> -
                            <input type="text" id="cardNumber4" class="input-small" maxlength="4"
                              [(ngModel)]="cardNumber4" name="cardNumber4">
                          </div>
                          <div class="form-group">
                            <label>信用卡有效年月</label>
                            <input type="text" id="expiryMonth" class="input-small" maxlength="2"
                              [(ngModel)]="expiryMonth" name="expiryMonth"> -
                            <input type="text" id="expiryYear" class="input-small" maxlength="2"
                              [(ngModel)]="expiryYear" name="expiryYear">
                          </div>
                          <div class="form-group">
                            <label for="cvv">信用卡背面末三碼</label>
                            <input type="text" id="cvv" class="input-text" placeholder="***" maxlength="3"
                              [(ngModel)]="cvv" name="cvv">
                            <!-- <div>(此欄位為驗證之間,綠界科技不予以記錄)</div> -->
                          </div>
                          <div class="form-group">
                            <label for="phoneNumber">手機號碼</label>
                            <input type="tel" id="phoneNumber" class="input-text" placeholder="如非台灣手機號碼請加國碼"
                              [(ngModel)]="phoneNumber" name="phoneNumber">
                            <div>(如非台灣手機號碼請加國碼)</div>
                          </div>
                          <!-- 填滿欄位按鈕 -->
                          <button (click)="fillForm()">填滿範例資料</button>
                        </div>

                        <button type="button" class="button" style="margin-top: 20PX;" name="save_address"
                          (click)="onSubmit(siteDetails.siteId)" onclick="alert('場地預約完成')">送出</button>
                      </div>

                    </form>


                  </div>
                </div>
              </div>
              <!-- .entry-content -->
            </article>
          </main>
        </div>

      </div>
